<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starting BOZ</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #e8f7fb; background: #080b0d; }
      main { text-align: center; }
      .mark { display: block; width: 112px; height: 112px; margin: 0 auto 22px; object-fit: contain; }
      h1 { margin: 0; font-size: 22px; letter-spacing: .02em; }
      p { margin: 9px 0 24px; color: #8ca4aa; font-size: 13px; }
      .track { width: 210px; height: 3px; margin: auto; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.09); }
      .bar { width: 42%; height: 100%; border-radius: inherit; background: #3bd8ee; animation: load 1.25s ease-in-out infinite alternate; }
      @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(240%); } }
    </style>
  </head>
  <body data-tauri-drag-region>
    <main aria-live="polite" data-tauri-drag-region>
      <img class="mark" src="logo-boz-transparant-white.png" alt="BOZ" />
      <h1>Starting BOZ</h1>
      <p>Preparing your private market workspace…</p>
      <div class="track" aria-hidden="true"><div class="bar"></div></div>
    </main>
  </body>
</html>
