<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starting BOZ</title>
    <style>
      /*
        Colors mirror the dark-mode block of src/app/styles/tokens.css. This page
        has no build step, so they are literal — but they are not free to drift:
        tests/boot-screen.test.ts parses tokens.css and fails if any of these
        stop matching. The previous values (#080b0d / #3bd8ee / #e8f7fb) were a
        dead cyan brand that the app itself abandoned.
      */
      :root {
        --bg-primary:    #181818;
        --border-glass:  #2d2d2d;
        --text-primary:  #ffffff;
        --text-secondary:#a3a3a3;
        --text-muted:    #737373;
        /* --accent-cyan is #ffffff in dark mode: the UI is monochrome and only
           --bull / --bear carry meaning. */
        --accent:        #ffffff;
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: var(--text-primary); background: var(--bg-primary); }
      main { text-align: center; width: min(420px, 82vw); }
      .mark { display: block; width: 112px; height: 112px; margin: 0 auto 22px; object-fit: contain; }
      h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: .02em; }
      p { margin: 9px 0 24px; color: var(--text-secondary); font-size: 13px; min-height: 18px; }
      .track { width: 100%; height: 3px; overflow: hidden; border-radius: 99px; background: var(--border-glass); }
      .bar { width: 4%; height: 100%; border-radius: inherit; background: var(--accent); transition: width .35s ease; }
      .meta { display: flex; justify-content: space-between; margin-top: 10px; color: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
      .slow { margin-top: 18px; color: var(--text-secondary); font-size: 12px; }
      .hint { margin-top: 6px; color: var(--text-muted); font-size: 12px; }
      /* Pre-hydration state: a slow crawl so the bar is never frozen at 4%,
         which reads as a hang. The host overwrites it within a few hundred ms. */
      .bar { animation: crawl 2.4s ease-in-out infinite alternate; }
      @keyframes crawl { from { width: 4%; } to { width: 14%; } }
      .hosted .bar { animation: none; }
    </style>
  </head>
  <body data-tauri-drag-region>
    <!--
      Zero JavaScript on purpose. The desktop CSP is script-src 'none', and the
      host drives this page through webview eval(), so there is no script
      surface during boot at all. Every id below is written by Rust.
    -->
    <main aria-live="polite" data-tauri-drag-region>
      <img class="mark" src="logo-boz-transparant-white.png" alt="BOZ" />
      <h1>Starting BOZ</h1>
      <p id="stage">Preparing your private market workspace…</p>
      <div
        class="track"
        role="progressbar"
        aria-labelledby="stage"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="4"
        id="track"
      >
        <div class="bar" id="bar"></div>
      </div>
      <div class="meta">
        <span id="version">BOZ</span>
        <span id="pct" aria-hidden="true">4%</span>
      </div>
      <div class="slow" id="slow" hidden>
        First launch takes a little longer. BOZ is still working.
      </div>
      <div class="hint" id="hint" hidden>
        If this does not finish, the desktop log is next to the app data folder.
      </div>
    </main>
  </body>
</html>
