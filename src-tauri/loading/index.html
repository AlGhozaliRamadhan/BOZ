<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starting BOZ</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #e8f7fb; background: radial-gradient(circle at 50% 35%, #12313a 0, #071115 38%, #030708 76%); }
      main { text-align: center; }
      .mark { width: 76px; height: 76px; margin: 0 auto 22px; border-radius: 20px; display: grid; place-items: center; color: #041014; background: linear-gradient(135deg, #71ecff, #11b9d4); font-size: 31px; font-weight: 800; letter-spacing: -2px; box-shadow: 0 18px 60px rgba(17,185,212,.24); }
      h1 { margin: 0; font-size: 22px; letter-spacing: .02em; }
      p { margin: 9px 0 24px; color: #8ca4aa; font-size: 13px; }
      .track { width: 210px; height: 3px; margin: auto; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.09); }
      .bar { width: 42%; height: 100%; border-radius: inherit; background: #3bd8ee; animation: load 1.25s ease-in-out infinite alternate; }
      @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(240%); } }
    </style>
  </head>
  <body>
    <main aria-live="polite">
      <div class="mark" aria-hidden="true">B</div>
      <h1>Starting BOZ</h1>
      <p>Preparing your private market workspace…</p>
      <div class="track" aria-hidden="true"><div class="bar"></div></div>
    </main>
  </body>
</html>
